services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ilac
      POSTGRES_PASSWORD: ilac
      POSTGRES_DB: ilac_kocu
    # Yalnızca yerel geliştirme için, sadece bu makineden (5432 çoğu zaman başka bir PostgreSQL ile çakışır)
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilac -d ilac_kocu"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  # Şema migration'ları: API ve işçiden önce bir kez koşar, sonra çıkar
  migrate:
    build: ./backend
    image: ilac-kocu-backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ilac:ilac@db:5432/ilac_kocu
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    image: ilac-kocu-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ilac:ilac@db:5432/ilac_kocu
      REDIS_URL: redis://redis:6379/0
      # Next.js (web) konteyneri Docker iç ağından gelir; gerçek istemci IP'sini X-Forwarded-For'da iletir
      TRUSTED_PROXIES: '["127.0.0.1","::1","172.16.0.0/12"]'
    # Yalnızca bu makineden (Swagger için); dışarıya açık olursa X-Forwarded-For taklit edilebilir
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # Koç kuyruğu işçisi + doz hatırlatma zamanlayıcısı (API zamanlayıcıyı başlatmaz)
  worker:
    build: ./backend  # migrate/api/worker aynı imajı paylaşır (derleme önbellekten gelir)
    image: ilac-kocu-backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ilac:ilac@db:5432/ilac_kocu
      REDIS_URL: redis://redis:6379/0
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  web:
    build: ./frontend
    environment:
      # Sunucu tarafı proxy FastAPI'ye Docker ağı üzerinden gider; tarayıcı yalnızca web'e konuşur.
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
