services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ilac
      POSTGRES_PASSWORD: ilac
      POSTGRES_DB: ilac_kocu
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilac -d ilac_kocu"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ilac:ilac@db:5432/ilac_kocu
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./frontend
    environment:
      # Sunucu tarafı proxy FastAPI'ye Docker ağı üzerinden gider; tarayıcı yalnızca web'e konuşur.
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
