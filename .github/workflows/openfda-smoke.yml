name: openFDA izleme

# Haftalık (pazartesi 06:00 UTC) ve elle tetiklenen canlı erişim kontrolü. openFDA'ya birkaç küçük gerçek istek
# atar; senkron ve etiket çekmenin dayandığı alanlar hâlâ yerinde mi bakar (tests/test_openfda_live.py).
# Normal CI (ci.yml) bu testleri koşmaz: `openfda_live` işaretli testler varsayılan koşuda atlanır.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfda-smoke
  cancel-in-progress: true

jobs:
  openfda-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      DATABASE_URL: "sqlite://"
      # İsteğe bağlı: depo sırrı tanımlıysa oran sınırı yükselir (anahtarsız: dakikada 240, günde 1000 istek)
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: openFDA canlı alan kontrolü
        run: pytest -v -m openfda_live tests/test_openfda_live.py
