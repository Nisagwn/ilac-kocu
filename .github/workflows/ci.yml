name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ilac
          POSTGRES_PASSWORD: ilac
          POSTGRES_DB: ilac_kocu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ilac" --health-interval 5s --health-retries 10
    env:
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts

      # Senaryo sayısı tests/guardrail_scenarios.yaml'dan gelir (sabit yazılmaz)
      - name: Guardrail red-team seti
        run: pytest tests/test_guardrails.py -v

      - name: Koç kalite değerlendirme seti (kural tabanlı koç + araç çıktıları)
        run: pytest tests/test_coach_eval.py -v

      # Yukarıdaki iki set burada tekrar koşmaz; postgres testleri aşağıda gerçek veritabanında koşar
      - name: Birim ve API testleri
        run: >-
          pytest -q -m "not postgres"
          --ignore=tests/test_guardrails.py --ignore=tests/test_coach_eval.py

      - name: PostgreSQL + pgvector testleri (RAG araması, lider kilidi)
        env:
          DATABASE_URL: postgresql+psycopg://ilac:ilac@localhost:5432/ilac_kocu
        run: pytest -v -m postgres tests/test_postgres.py

      - name: Migration (PostgreSQL) — upgrade / downgrade / upgrade
        env:
          DATABASE_URL: postgresql+psycopg://ilac:ilac@localhost:5432/ilac_kocu
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python -m app.seed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tip denetimi
        run: npx tsc --noEmit

      - name: Derleme
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: API Docker imajı
        run: docker build -t ilac-kocu-api ./backend
      - name: Web Docker imajı
        run: docker build -t ilac-kocu-web ./frontend
