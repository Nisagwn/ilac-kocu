name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ilac
          POSTGRES_PASSWORD: ilac
          POSTGRES_DB: ilac_kocu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ilac" --health-interval 5s --health-retries 10
    env:
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Guardrail red-team seti (40 senaryo)
        run: pytest tests/test_guardrails.py -v

      - name: Birim ve API testleri
        run: pytest -q

      - name: Migration (PostgreSQL) — upgrade / downgrade / upgrade
        env:
          DATABASE_URL: postgresql+psycopg://ilac:ilac@localhost:5432/ilac_kocu
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python -m app.seed

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Docker image build
        run: docker build -t ilac-kocu-api ./backend
