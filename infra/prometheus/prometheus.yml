# Prometheus: API kopyaları (DNS ile keşif: "api" her kopyanın IP'sine çözülür) ve kuyruk işçisi.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 15s
    # METRICS_TOKEN tanımlıysa:
    # authorization: {type: Bearer, credentials_file: /etc/prometheus/metrics_token}

  - job_name: worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101
        refresh_interval: 15s
