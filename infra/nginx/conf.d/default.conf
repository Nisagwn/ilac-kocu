# ---------------------------------------------------------------- dış giriş (HTTP :80)
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;
    # Demo/teşhis: yanıtı hangi upstream üyesinin verdiği ve istek kimliği
    add_header X-Upstream $upstream_addr always;
    add_header X-Request-ID $req_id always;

    include /etc/nginx/snippets/web-locations.conf;
}

# ---------------------------------------------------------------- iç API ağ geçidi (:8081)
# Next.js sunucu tarafı proxy'si (API_URL=http://nginx:8081) ve yalnız yerel geliştirici erişimi
# (docker-compose: 127.0.0.1:${API_GATEWAY_PORT:-8000} → 8081; Swagger http://localhost:8000/docs).
# Bu port dış ağa yayınlanmaz. FastAPI kopyalarına least_conn ile dağıtır; X-Upstream başlığı
# hangi kopyanın yanıt verdiğini gösterir.
server {
    listen 8081;
    server_name _;

    add_header X-Upstream $upstream_addr always;
    add_header X-Request-ID $req_id always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Prometheus metrikleri her kopyadan doğrudan kazınır (dns_sd); dengelenmiş tek uç anlamsız olurdu
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Güven zinciri: dış istemci X-Forwarded-For'u 80/443'te $remote_addr ile ezilir; Next.js bunu tek
        # değer olarak buraya iletir ve burada korunur. Bu porta yalnızca compose iç ağı ve 127.0.0.1 erişir.
        proxy_set_header X-Forwarded-For $gateway_xff;
        proxy_set_header X-Request-ID $req_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
        # Bağlantı hatası / kapanmakta olan kopya (502-504) → bir sonraki kopya. nginx, POST/PATCH gibi
        # idempotent olmayan istekleri (non_idempotent verilmediği için) upstream'e gönderildikten sonra
        # TEKRARLAMAZ: ölçüm iki kez yazılmaz.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }
}
