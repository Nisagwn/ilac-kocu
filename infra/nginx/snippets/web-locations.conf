# 80 ve 443 sunucu bloklarının ortak konumları.

# nginx'in kendi canlılık ucu (Docker healthcheck); upstream'e gitmez
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Next.js derleme çıktısı (içerik karma adlı, değişmez): istek sınırından muaf, ucuz
location /_next/static/ {
    include /etc/nginx/snippets/proxy-web.conf;
}

location / {
    # IP başına NGINX_RATE_LIMIT (varsayılan 20 istek/sn) + 40 patlama payı (sayfa açılışındaki istekler sığar)
    limit_req zone=per_ip burst=40 nodelay;
    include /etc/nginx/snippets/proxy-web.conf;
}
