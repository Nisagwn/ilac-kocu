proxy_pass http://api_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# realip sonrası $remote_addr gerçek istemcidir; API yalnızca TRUSTED_PROXIES'ten gelen bu başlığa güvenir
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $req_id;

proxy_connect_timeout 2s;
proxy_read_timeout 60s;
# Kopya düşerse istek diğerine aktarılır. nginx POST/PATCH gibi idempotent olmayan istekleri varsayılan
# olarak yeniden göndermez (çift kayıt olmaz); istemci Idempotency-Key ile güvenle yeniden deneyebilir.
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 5s;

