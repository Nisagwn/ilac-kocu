# Dış istek → Next.js (web). 80 ve 443 sunucu bloklarında ortak.
proxy_pass http://web_frontend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;               # bağlantı noktası dahil (Next yönlendirmeleri doğru olsun)
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
# İstemciden gelen X-Forwarded-For YOK SAYILIR, gerçek bağlantı adresiyle yeniden yazılır (taklit edilemez).
# Next.js bu değeri (lib/server.ts clientIpFrom) backend'e iletir; backend yalnızca nginx'e güvenir.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Request-ID $req_id;
proxy_connect_timeout 3s;
proxy_read_timeout 90s;                          # koç sohbeti (LLM) eşzamanlı yolda ~60 sn sürebilir
proxy_next_upstream error timeout http_502 http_503;

# Güvenlik başlıklarının tek kaynağı nginx (security-headers.conf)
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Powered-By;
# Content-Security-Policy BİLEREK gizlenmez: istek başına nonce içeren tek CSP kaynağı Next.js middleware'idir.
