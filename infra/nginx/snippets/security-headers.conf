# Dış sunucu bloklarındaki (80/443) güvenlik başlıkları. Next.js'in aynı adlı başlıkları
# proxy-web.conf içinde gizlenir; tek kaynak burasıdır (çift başlık olmasın).
#
# CSP BURADA YOK: istek başına nonce gerektirdiği için Next.js middleware'inde (frontend/src/middleware.ts)
# üretilir ve proxy-web.conf onu gizlemeden geçirir. nginx'te de eklenseydi tarayıcı iki politikayı birden
# uygular, nonce'suz olan Next.js betiklerini engellerdi. /api yolları (Next route handler) ve
# /offline.html için sıkı sabit CSP next.config.ts'te verilir.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
