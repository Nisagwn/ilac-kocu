# Dış sunucu bloklarındaki (80/443) güvenlik başlıkları. Next.js'in aynı adlı başlıkları
# proxy-web.conf içinde gizlenir; tek kaynak burasıdır (çift başlık olmasın).
#
# CSP: Next.js App Router, RSC yükünü satır içi <script> ile aktarır (self.__next_f.push) ve
# satır içi stil kullanır; nonce altyapısı olmadan 'unsafe-inline' zorunludur. Dış kaynak yok
# (fontlar derlemede gömülür, grafikler Recharts/SVG), bu yüzden diğer her şey 'self' ile sınırlı.
# Web push aboneliği tarayıcının push servisine gider; connect-src'yi etkilemez.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
