# İlaç Uyumu Koçu — ters proxy + yük dengeleyici (tek dış giriş noktası)
#
#   tarayıcı ──:80/:443──► nginx ──► web (Next.js, :3000)
#                                      │  sunucu tarafı proxy (/api/proxy/*, /api/auth/*)
#                                      ▼
#   (yalnız yerel) 127.0.0.1:8000 ──► nginx :8081 "iç API ağ geçidi" ──least_conn──► api × N (:8000)
#
# Ayrıntı ve gerekçeler: infra/README.md

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # Docker'ın gömülü DNS'i: "api" adı tüm kopyaların IP'lerini döndürür. Upstream'lerdeki `resolve`
    # parametresi adı periyodik olarak yeniden çözer; ölçeklenen/yeniden başlayan konteynerler
    # nginx yeniden yüklenmeden dağıtıma girer/çıkar.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # --- İstek kimliği: güvenli biçimdeki gelen X-Request-ID korunur, yoksa nginx üretir ---
    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
        default $request_id;
    }

    # --- İç ağ geçidi: Next.js'in ilettiği istemci IP'si korunur, yoksa bağlantının karşı ucu ---
    map $http_x_forwarded_for $gateway_xff {
        "" $remote_addr;
        default $http_x_forwarded_for;
    }

    # --- JSON erişim logu ---
    # Gizlilik: $request / $request_uri / $args KULLANILMAZ — sorgu dizesi sağlık verisi içerebilir
    # (ör. /education/search?q=...). Yalnızca yol ($uri), durum ve süreler yazılır.
    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
        '"server_port":"$server_port","method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;

    # --- Sıkıştırma ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # --- Gövde ve zaman aşımı sınırları (API yükleri küçük JSON'dur) ---
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # --- IP başına istek sınırı: bölge (hız) conf.d/00-ratelimit.conf içinde (NGINX_RATE_LIMIT) ---
    limit_req_status 429;
    limit_req_log_level warn;

    # --- Upstream'ler ---
    upstream api_backend {
        zone api_backend 64k;          # `resolve` için paylaşımlı bellek bölgesi şart
        least_conn;                    # uzun süren koç (LLM) istekleri tek kopyada birikmesin
        server api:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 30s;         # uvicorn --timeout-keep-alive (65 sn) değerinden KISA olmalı
    }

    upstream web_frontend {
        zone web_frontend 64k;
        server web:3000 resolve max_fails=3 fail_timeout=10s;
        keepalive 16;
        keepalive_timeout 30s;
    }

    include /etc/nginx/conf.d/*.conf;
}
