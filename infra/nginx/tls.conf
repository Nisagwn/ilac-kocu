# HTTPS sunucusu — varsayılan KAPALI. Açmak için (infra/README.md "TLS"):
#   sh infra/nginx/gen-cert.sh
#   docker compose -f docker-compose.yml -f infra/nginx/compose.tls.yml up -d
# compose.tls.yml bu dosyayı /etc/nginx/conf.d/tls.conf olarak, sertifikaları /etc/nginx/certs altına bağlar.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/security-headers.conf;
    # HSTS yalnızca TLS'te. Yerel self-signed sertifikada kısa tutulur (localhost'u tarayıcıda uzun süre
    # HTTPS'e kilitlemesin); üretimde: max-age=31536000; includeSubDomains
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Upstream $upstream_addr always;
    add_header X-Request-ID $req_id always;

    include /etc/nginx/snippets/web-locations.conf;
}
