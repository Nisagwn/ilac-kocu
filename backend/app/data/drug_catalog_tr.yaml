# Kürate Türkçe ilaç kataloğu (Tip 2 diyabet, hipertansiyon ve sık eşlik eden tedaviler).
#
# openFDA yalnızca ABD etiketlerini içerir; Türkiye'deki ticari adlar (Glifor, Concor...) orada yoktur.
# Bu dosya TR ticari adı -> etken madde (generic, İngilizce INN; openFDA sorgusu için) eşlemesinin
# tek doğruluk kaynağıdır. `python -m app.seed` her çalıştırmada drug_catalog tablosuna upsert eder;
# openFDA senkronu (`python -m app.scripts.sync_drug_catalog`) isteğe bağlıdır ve ABD marka adlarını ekler.
#
# Alanlar:
#   generic      etken madde(ler); kombinasyonlarda " + " ile ayrılır (sıra önemsizdir, anahtar sıralanır)
#   display      arayüzde gösterilecek ad (verilmezse generic'ten üretilir)
#   pharm_class  Türkçe farmakolojik sınıf
#   brands       Türkiye'de yaygın ticari adlar
#   aliases      (isteğe bağlı) aranabilir ek adlar, ör. Türkçe etken madde adı
#
# Not: Bu liste eğitim/demo amaçlıdır; ruhsat durumu için TİTCK kayıtları esas alınmalıdır.

