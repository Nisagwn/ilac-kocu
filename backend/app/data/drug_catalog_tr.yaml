# Kürate TR ilaç kataloğu: Türkiye'de yaygın ticari adlar -> etken madde (openFDA generic_name, İngilizce).
#
# - openFDA ABD etiketlerini döndürür; TR ticari adları orada yoktur. Etiket sorgusu `generic` üzerinden atılır
#   (app/services/openfda.py: resolve_generic bu dosyadan beslenir).
# - `group`: diabetes | hypertension | other (hekim panelinde ve aramada gruplama için).
# - `pharm_class`: openFDA EPC sınıfı (katalog senkronu aynı sınıfları kullanır).
# - Demo amaçlıdır; üretimde TİTCK ilaç listesiyle doğrulanmalıdır. Doz bilgisi bilinçli olarak tutulmaz.

