# Kürate katman: TİTCK'dan üretilen Türkçe ilaç kataloğunun (drug_catalog_tr.yaml) elle bakılan girdisi.
#
# Bu dosya uygulama tarafından doğrudan okunmaz. `python -m app.scripts.import_titck <TİTCK Excel>` TİTCK
# "Ruhsatlı Beşeri Tıbbi Ürünler Listesi"nden app/data/drug_catalog_tr.yaml'ı üretirken bu dosyayı şunlar için
# kullanır: görünen ad (display), Türkçe sınıf adı düzeltmesi (pharm_class), aranabilir ek adlar (aliases) ve
# öncelikli/özel yazımlı TR markalar (brands). Buradaki her TR marka TİTCK listesinde ilgili etken maddenin
# ruhsatlı ürünü olarak bulunmalıdır; tests/test_titck.py üretilmiş katalogla çapraz kontrol eder.
# TİTCK listesinde bulunmayan uluslararası adlar (Glucophage, Zocor...) brands yerine aliases'a yazılır.
#
# Alanlar:
#   generic      etken madde(ler), İngilizce (openFDA sorgusu için); kombinasyonlarda " + " ile ayrılır
#   display      arayüzde gösterilecek ad (verilmezse etken madde tablosundan üretilir)
#   pharm_class  Türkçe farmakolojik sınıf (verilmezse ATC kodundan üretilir)
#   brands       Türkiye'de yaygın ticari adlar (TİTCK'da doğrulanır)
#   aliases      (isteğe bağlı) aranabilir ek adlar, ör. Türkçe etken madde adı, ruhsatı olmayan uluslararası ad
#
# Not: Bu liste eğitim/demo amaçlıdır; ruhsat durumu için TİTCK kayıtları esas alınmalıdır.

