[project]
name = "ilac-kocu-backend"
version = "0.2.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP042"]  # Depends() kalıbı; satır uzunluğunu formatter yönetir; str+Enum bilinçli

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "postgres: gerçek PostgreSQL (+pgvector) gerektirir; TEST_DATABASE_URL yoksa atlanır",
]
